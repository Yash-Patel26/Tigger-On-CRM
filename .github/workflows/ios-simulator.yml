name: iOS Simulator Build (No Signing)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main ]

jobs:
  build-ios-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.9.0'
          channel: 'stable'

      - name: Verify Flutter is available
        run: |
          which flutter
          flutter --version
          dart --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (Simulator, no codesign)
        env:
          SKIP_INSTALL_COCOAPODS: '1'
        run: |
          # Build for iOS simulator (x86_64/arm64) without code signing
          flutter build ios --simulator --no-codesign

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: |
            build/ios/iphonesimulator/**

