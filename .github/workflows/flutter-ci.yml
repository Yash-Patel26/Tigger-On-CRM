name: Flutter CI (Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.9.0'
          channel: 'stable'

      - name: Verify Flutter is available
        run: |
          which flutter
          flutter --version
          dart --version

      - name: Flutter pub get
        run: flutter pub get

      # Uncomment to run static analysis
      # - name: Flutter analyze
      #   run: flutter analyze

      # Uncomment to run tests
      # - name: Flutter test
      #   run: flutter test --no-pub

