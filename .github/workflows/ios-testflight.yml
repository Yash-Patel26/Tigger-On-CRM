name: iOS Release to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    env:
      # Configure your Flutter version to match pubspec.yaml sdk constraint
      FLUTTER_VERSION: '3.9.0'
      IOS_SCHEME: Runner
      IOS_WORKSPACE: ios/Runner.xcworkspace
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Verify Flutter is available
        run: |
          which flutter
          flutter --version
          dart --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install fastlane
        run: |
          gem install fastlane -N

      # Import signing certs (P12) and provisioning profile from repo secrets
      - name: Import Signing Certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CERTS_P12_BASE64 }}
          p12-password: ${{ secrets.CERTS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        if: ${{ secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}

      - name: Xcode Select
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: CocoaPods install
        working-directory: ios
        run: |
          pod repo update
          pod install

      - name: Build IPA (Flutter)
        env:
          CI: true
        run: |
          # Build a signed IPA using Flutter (honors Xcode signing settings)
          flutter build ipa --release

      - name: Upload to TestFlight (Fastlane pilot)
        if: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          # Create API key file for App Store Connect from base64 secret
          mkdir -p .asc
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > .asc/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
          echo "IPA_PATH=${IPA_PATH}"

          # Use fastlane pilot with API key to upload
          fastlane pilot upload \
            --api_key_path .asc/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            --api_key_id ${APP_STORE_CONNECT_KEY_ID} \
            --api_issuer ${APP_STORE_CONNECT_ISSUER_ID} \
            --ipa "$IPA_PATH" \
            --skip_waiting_for_build_processing true

      - name: Upload IPA as artifact (fallback)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

    # Notes:
    # - Required secrets for end-to-end TestFlight upload:
    #   CERTS_P12_BASE64: Base64 of your iOS Distribution .p12 certificate
    #   CERTS_P12_PASSWORD: Password for the .p12
    #   PROVISIONING_PROFILE_BASE64: Base64 of the distribution provisioning profile (.mobileprovision)
    #   APP_STORE_CONNECT_API_KEY_BASE64: Base64 of App Store Connect API key .p8
    #   APP_STORE_CONNECT_KEY_ID: The key ID for the API key
    #   APP_STORE_CONNECT_ISSUER_ID: The issuer ID for your App Store Connect API key
    # - In Xcode, set automatic signing on the Runner target with your Team.
    # - Ensure bundle identifier and capabilities match your provisioning profile.

