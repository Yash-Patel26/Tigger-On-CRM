<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradArc" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F05A3A"/>
      <stop offset="50%" stop-color="#B74133"/>
      <stop offset="100%" stop-color="#7A241A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset in="blur" dx="0" dy="1.5" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="rotate(45 50 50)" filter="url(#shadow)">
    <path d="M50,15 
             A35,35 0 1,1 15,50" 
          fill="none" 
          stroke="url(#gradArc)" 
          stroke-width="12" 
          stroke-linecap="round"/>
    <path d="M50,15 
             A35,35 0 1,1 15,50" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-opacity="0.25" 
          stroke-width="4" 
          stroke-linecap="round"
          stroke-dasharray="55 999"/>
    <polygon points="50,0 65,25 35,25" fill="#B74133" stroke="#7A241A" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>

